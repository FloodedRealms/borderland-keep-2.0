<div id="summary-modal" _="on closeModal add .closing then wait for animationend then remove me">
  <div class="modal-underlay" _="on click trigger closeModal"></div>
  <div class="modal-content">
    <h2 class="modal-title">Summary</h2>
    <div class="modal-grid">
      <pre id="summary-text">
{{ .Text }}
      </pre>
    </div>
    <div class="modal-actions">
      <button class="copy-button"
        _="on click call navigator.clipboard.writeText(#summary-text.innerText)
           then set my.textContent to '✓ Copied!'
           then wait 2s
           then set my.textContent to 'Copy to Clipboard'">
        Copy to Clipboard
      </button>
      <button class="modal-close-button danger-button" _="on click trigger closeModal">Close</button>
    </div>
  </div>
</div>
